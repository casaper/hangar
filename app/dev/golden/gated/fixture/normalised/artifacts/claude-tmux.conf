# GENERATED by `hangar claude` (%HANGAR%) -- do not edit by hand.
# tmux config for the hangar-root session server: tmux -L hangar-wt-claude
# Rewritten every run, immediately before the server starts -- so editing it by
# hand lasts exactly until the next one.

# ---- Claude Code inside tmux ------------------------------------------------------
# The same four settings the clone server gets, and for the same reason: both windows
# here run Claude Code. Two of them are SERVER options, which is why this is a server
# of its own rather than a session on somebody else's.
set -s  extended-keys on                     # Shift+Enter inserts a newline in Claude Code instead of submitting
set -as terminal-features 'xterm*:extkeys'   # advertises extended keys to the terminal outside -- the other half of Shift+Enter
set -g  allow-passthrough on                 # lets Claude Code's notifications through tmux to the terminal outside
set -g  mouse on                             # mouse-wheel scrolling in Claude Code's fullscreen rendering

# ---- whose sessions these are -----------------------------------------------------
set -g @hangar_id wt

# ---- the two windows --------------------------------------------------------------
# `renumber-windows off` is the one that matters: operator is window 1 and developer is
# window 2, and closing one must not renumber the other. With it on, exiting operator
# would move developer to index 1 and the next run would recreate operator at 2 -- the
# tabs would swap places for no reason the developer could see.
set -g  base-index 1
set -gw pane-base-index 1
set -g  renumber-windows off

# ---- the status line --------------------------------------------------------------
# One line, and the whole width goes to the tabs. `hangar claude` writes this same list
# onto a server that is already running, since every one of them is a session option.
set -g status on
set -g status-position top
set -g status-style 'bg=#1c1c1c,fg=#bbbbbb'
set -g status-left ''
set -g status-left-length 0
set -g status-right '#{?client_prefix,^B ,}'
set -g status-right-length 3
set -g window-status-style 'fg=#8a8a8a'
set -g window-status-format ' #W '
set -g window-status-current-format ' #[fg=#bbbbbb,bold]#W#[default] '

# Which hangar, in the TERMINAL WINDOW title -- the bar has no width to spare for it.
set -g set-titles on
set -g set-titles-string 'wt - #{window_name}'

# ---- the rest ---------------------------------------------------------------------
set -g default-terminal 'tmux-256color'
set -g escape-time 10
set -g history-limit 50000
set -g focus-events on
