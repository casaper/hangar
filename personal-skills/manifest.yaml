# Personal Claude Code skills this hangar keeps, and how each relates to the project skill it
# shadows. `hangar skills sync` links ~/.claude/skills/<name> here; `hangar skills list` and
# `hangar doctor` report drift.
#
# A skill at ~/.claude/skills/<name>/ replaces a same-named project skill ENTIRELY, on this
# machine, in every repo -- documented precedence is enterprise > personal > project, keyed on the
# DIRECTORY name. That is the supported way to run a personal version of a skill a project tracks,
# and it changes nothing in the project. What it does not come with is any way to notice the
# tracked original moving underneath you, which is what this file exists for.
#
# divergence:
#   intentional  the copy here is MEANT to differ. Comparing content would be red forever, so what
#                is checked is whether the ORIGINAL has moved since the override was taken off it
#                -- that is what `basedOn` records. When it moves, re-derive and update the hash.
#   none         the copy here should stay byte-identical to the original. Prefer having no
#                personal copy at all over this: one that may not differ can only drift.
#   standalone   no tracked counterpart anywhere, so there is nothing to compare.
#
# `mirrors` is a path inside the managed repo's own checkout, read from `forge.defaultBranch`
# rather than from whatever branch a clone happens to have out.
#
# A skill adopted from a branch that has NOT MERGED yet is `intentional`, never `standalone`: its
# counterpart exists, it is simply not on the default branch. `mirrors` names where it will be,
# `basedOn` is the blob it was taken off, and `adoptedFrom` names the branch -- which is what tells
# an absent original from a REMOVED one, and is the only record of where that blob is reachable
# from until it merges. The row reads `pending` and is not a failure; the comparison resumes by
# itself the day the branch lands, green if the skill arrived unchanged and naming the move if it
# did not. Drop `adoptedFrom` then; it does nothing once there is something to compare against.

skills:
  - name: shorten-comment
    divergence: intentional
    mirrors: .claude/skills/shorten-comment/SKILL.md
    basedOn: 3df1c0c526807af2fa701eecdcbe5d65627d376a
    reason: >-
      Adds the "Reporting -- the edit is the verdict" contract (one line per changed block, no
      narrated justification) and judges every block in a file from a single read instead of one
      Read per comment. Both are speed, not policy: the pre-edit safety gates are untouched.

  - name: shorten-changed-comments
    divergence: intentional
    mirrors: .claude/skills/shorten-changed-comments/SKILL.md
    basedOn: f221fc77b02c174a0a6d340f99a7fa01ee9e57b8
    reason: Honours shorten-comment's reporting contract; keeps the Step 1b selection question.

  - name: shorten-all-comments
    divergence: intentional
    mirrors: .claude/skills/shorten-all-comments/SKILL.md
    basedOn: 6df88f3131ef327ec11fdfe79c40bcad6f4ef4be
    reason: Honours shorten-comment's reporting contract; keeps the Step 2 snapshot/covers checks.

  - name: fix-commit
    divergence: intentional
    mirrors: .claude/skills/fix-commit/SKILL.md
    basedOn: 691ab4f79c8b62190a0fb87c6e73e6da8a277ffe
    reason: >-
      Inverts the tracked skill in one direction only. That one forbids rewriting outright; this
      permits it for UNPUBLISHED commits, on request, through `hangar-rewrite`, which refuses any
      commit reachable from a remote-tracking ref. The ban exists to protect published history and
      that protection is kept, by a mechanism instead of a convention. The never-push rule is not
      relaxed -- it is stated more strongly, because a local rewrite is what tempts a force-push.

  - name: granular-commits
    divergence: intentional
    mirrors: .claude/skills/granular-commits/SKILL.md
    basedOn: 1a65a69a5b051bd3d3b12f14178dce849e3f5d12
    adoptedFrom: docs/agent_commit_behaviour_stays_as_is_but_user_can_opt_in_for_commit_last_behaviour
    reason: >-
      Two touches, both forced by a personal skill being active in every repo on this machine and
      not just the one it was written in: the pre-split snapshot is taken with `hangar-waypoint`,
      which is on PATH in every clone and at the hangar root, and the `check-commits.mjs` run is
      made conditional on the repo actually shipping that file. The grouping rules, the staging
      and the verification stance are untouched. `basedOn` is the blob on the branch that ADDS
      this skill, which `adoptedFrom` names because it is reachable from nowhere else until that
      branch merges. Until then the row reads `pending` rather than red: waiting is the expected
      state, and the comparison resumes on its own the day it lands.

  - name: new-plan
    divergence: standalone
    reason: No tracked counterpart in any managed repo -- this one exists only at user level.

  - name: pr-readiness
    divergence: standalone
    reason: >-
      No tracked counterpart. It drives the repo's own pr-description, test and storybook skills
      rather than replacing any of them, and integrates through `hangar-rewrite rebase` where the
      repo's rules deny `git rebase`.
