# yaml-language-server: $schema=./hangar.schema.json
$schema: ./hangar.schema.json

_: >-
  Configuration for one hangar: a directory holding a fleet of full clones of one repo.
  Written by `hangar setup`. Validated strictly -- an unknown key is an error, not something
  ignored, because a silently dropped key is a setting that looks configured and is not.
  Check it with `hangar config validate`; see every applied default with `hangar config show`.

# Namespaces everything this hangar writes OUTSIDE its own root: ~/.claude/hangar/<id>,
# the theme filenames, and the shell function in the generated colour table. No dashes --
# it has to be a legal shell identifier. Never derived from the directory name, because
# ~/work/dvb_gn and ~/code/dvb_gn would collide in that shared state.
id: dvb_gn
displayName: storefront_ui
profile: storefront-ui

clones:
  prefix: clone_
  # The generated discovery regex is \d{2,} -- open at the top on purpose. The old
  # clone_0[0-9] glob stopped matching at clone_10.
  pad: 2

forge:
  kind: bitbucketCloud
  originUrl: git@bitbucket.org:acme/storefront_ui.git
  # Asked only when origin/HEAD is unset. Absent would mean "abort rather than guess".
  defaultBranch: master
  tokenEnvKey: BITBUCKET_TOKEN

tracker:
  kind: jira
  baseUrl: https://acme.atlassian.net
  # A whitelist, so a token like ISO-8601 or SHA-1 in a branch name is never mistaken for an
  # issue key. Without it the pattern stays open and leans on a denylist instead.
  keyPrefixes: [DN]
  cache:
    ttlMinutes: 60
    bypassEnvKey: JIRA_SYNC_NO_CACHE
  # Repo-relative, and deliberately the repo's OWN scripts: the namer is the tracked,
  # branch-versioned authority on cache filenames, so Hangar asks it instead of
  # reimplementing the naming -- an untracked copy drifts the first time a branch changes a
  # relation slug.
  syncScript: .claude/skills/jira-ticket-sync/sync.mjs
  namerScript: .claude/skills/jira-scope/jira-cache.mjs

repo:
  # Where the app package lives; '' means the repo root.
  appDir: angular
  # Fallback only -- `git ls-files -- *.envrc` is tried first, and discovery beats declaration.
  envrcDirs: ['.', 'angular', 'tests/playwright-regression-tests']
  cloneEnv:
    file: .env.local
    rootPathEnvKey: PROJECT_GIT_ROOT_PATH
  symlinks:
    - path: tests/playwright-regression-tests/.env.local
      target: '{secretsFile}'
      skipIfDirMissing: true
      # `why` is required, and this is a worked example of the reason: nothing in the
      # filesystem explains this link, and it is printed by add-clone and by doctor.
      why: >-
        the tracked tests/.env sets USER_READWRITE_PASSWORD= (empty) and direnv loads it
        AFTER .envrc.private, so this reload is what wins; delete it and Playwright logs in
        with an empty password
  install:
      # A step names either a `manager` (whose canonical command is built in) or an explicit
      # `command`. Any ecosystem works here -- maven, bundler, pip, cargo -- because Hangar
      # only runs the argv it is given and never assumes Node.
      #   npm => npm ci
    - dir: angular
      manager: npm
      nodeVersionFile: .nvmrc
  # Run inside a clone, where direnv has loaded its dotenv, and compared against the ports
  # below. Never run from the hangar root: there it reports clone_01's fallbacks for every
  # clone and does not error -- it just answers wrong.
  portCheckCommand: [node, dev/ports.mjs, --json]

ports:
  # Spacing between clones. Must match across hangars for the offset guarantee to hold.
  step: 100
  # This hangar's residue class mod step. Two hangars with different offsets can never
  # collide for ANY clone counts -- unlike a reserved block, which fails silently once a
  # hangar outgrows it. 0 keeps this hangar exactly where it already is, which matters
  # because changing a port moves a running dev server out from under a live session.
  offset: 0
  roles:
    - id: ng
      envKey: NG_DEV_SERVER_PORT
      base: 4200
      label: Angular dev server
    - id: storybook
      envKey: STORYBOOK_DEV_SERVER_PORT
      base: 6006
      label: Storybook
      # Declared, so the permissions.allow matcher can be GENERATED and stay fully anchored.
      # A looser pattern rewrites the wrong allow entry and leaves a check aimed at a
      # sibling's port.
      healthCheck:
        kind: httpCurl
        timeoutSeconds: 3
    - id: playwrightReport
      envKey: PLAYWRIGHT_REPORT_PORT
      base: 9323
      label: Playwright HTML report

terminal:
  tabs:
    - { role: claude, dir: '.', command: claude }
    - { role: shell, dir: '.' }
    - { role: app, dir: angular }

editor:
  # A list: a clone can be open in more than one editor, and they do not conflict -- their
  # project files are different files. `hangar <kind> sync` then keeps each editor's shareable
  # project files in step for the ones that have any.
  #
  #   vscode cursor windsurf vscodium code-insiders positron trae   the VS Code family; all read
  #                                                                 .vscode/, so one `vscode sync`
  #                                                                 covers every fork
  #   jetbrains   IntelliJ, WebStorm, PyCharm, ... (pick with `product` below)
  #   zed         .zed/settings.json and tasks.json
  #   emacs       emacsclient into a running session, else a fresh Emacs; .dir-locals.el
  #   vim         a GUI vim (mvim/gvim) if there is one, else nvim/vim in an extra clone tab
  #   xcode       launch only -- .xcodeproj is generated state, never shared
  #   eclipse     launch only -- .project/.classpath are tracked, so git owns them
  kinds: ['vscode']
  jetbrains:
    product: idea # idea | webstorm | pycharm | phpstorm | goland | rubymine | clion | rider | …
    launcher: '' # an explicit path, if Toolbox generated no shell scripts
  vim:
    command: '' # empty prefers mvim/gvim, then nvim/vim in a terminal tab
  eclipse:
    launcher: '' # Eclipse ships no launcher script; point at the one in the app bundle
  workspaceFileName: 'dvb_gn_{index2}.code-workspace'
  workspaceFolderLabel: '{index}: dvb_gn'
  workspaceDirs: ['.', 'angular']
  # Settings whose value is a clone-relative path and so must be rewritten per clone.
  rootPathKeys:
    stylelint.configBasedir: angular
    stylelint.configFile: angular/stylelint.config.mjs
    stylelint.stylelintPath: angular/node_modules/stylelint
    jestrunner.projectPath: angular
    coverage-gutters.manualCoverageFilePaths: angular/coverage/lcov.info
    prettier.configPath: angular/.prettierrc
    prettier.prettierPath: angular/node_modules/prettier
    storyExplorer.server.internal.npm.dir: angular

secrets:
  # Hangar-root-relative, so it sits OUTSIDE every clone and no clone can commit it.
  file: .env.shared
  mode: '600'
